[project]
name = "mywanip"
version = "0.1.0"
description = "Resolves your dynamic WAN IP, updates DNS, serves it over REST/SSE and fires webhooks on change"
readme = "README.md"
authors = [
    { name = "Bernard van Niekerk", email = "bernard.van.niekerk@icloud.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn>=0.34",
]

[project.urls]
Repository = "https://github.com/frizzy/mywanip"

[project.scripts]
mywanip = "mywanip.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
